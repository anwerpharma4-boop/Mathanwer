# Builds the offline web version (for iPad / iPhone Safari) and publishes it
# on GitHub Pages: https://<owner>.github.io/<repo>/
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Web app (iPad)

on:
  push:
    branches: [claude/english-iraq-learning-app-q3pwgd, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Install SQLite (used by the tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter test
      - name: Build web version
        run: tool/build_web.sh "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
